<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Actualizar Ruta Viral</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;background:#FFF8F2;color:#1B1220;margin:0;padding:32px 20px;text-align:center}h1{font-size:24px}p{font-size:17px;line-height:1.4}a{display:inline-block;margin-top:16px;padding:14px 22px;border-radius:999px;background:#F0203F;color:#fff;font-weight:700;text-decoration:none}</style>
</head><body>
<h1>Actualizando Ruta Viral…</h1>
<p id="m">Un momento.</p>
<script>
// solo quita el service worker viejo: localStorage, IndexedDB (fotos) y la caché de fotos se quedan
(async () => {
  const m = document.getElementById("m");
  try{
    if ("serviceWorker" in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const r of regs) if (r.scope.includes("/ruta-viral-china/")) await r.unregister();
    }
    if ("caches" in window){
      // la versión vieja guardó su página; se borra solo lo que no es foto
      for (const k of await caches.keys()){
        if (!k.startsWith("rvc-")) continue;
        const c = await caches.open(k);
        for (const req of await c.keys()) if (!/\/(img|icons)\//.test(req.url)) await c.delete(req);
      }
    }
    m.textContent = "Listo. Abriendo la versión nueva…";
  }catch(e){ m.textContent = "Toca el botón para abrirla."; }
  setTimeout(() => { location.replace("https://boscovaz390-blip.github.io/ruta-viral-china/?v=" + Date.now()); }, 800);
})();
</script>
<a href="https://boscovaz390-blip.github.io/ruta-viral-china/">Abrir Ruta Viral</a>
</body></html>
